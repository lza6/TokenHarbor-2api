# TokenHarbor2API CI/CD — 构建 + 测试 + 自动发布 Release + Docker 镜像
name: Build & Test & Release

on:
  push:
    tags:
      - "v*"
    branches: [main]
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build gateway (release)
        run: cargo build --release

      - name: Run tests + clippy
        shell: bash
        run: |
          set +e
          cargo test --lib --tests 2>&1 | tee /tmp/test.log; TEST_RC=${PIPESTATUS[0]}
          cargo clippy --all-targets -- -D warnings 2>&1 | tee /tmp/clippy.log; CLIPPY_RC=${PIPESTATUS[0]}
          echo "test rc=$TEST_RC clippy rc=$CLIPPY_RC"
          if [ "$TEST_RC" -ne 0 ]; then
            echo "::error title=cargo-test-failed::$(tail -n 40 /tmp/test.log | tr '\n' '|' | cut -c1-6000)"
          fi
          if [ "$CLIPPY_RC" -ne 0 ]; then
            echo "::error title=cargo-clippy-failed::$(tail -n 40 /tmp/clippy.log | tr '\n' '|' | cut -c1-6000)"
          fi
          exit $((TEST_RC || CLIPPY_RC))

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokenharbor2api-windows-x64
          path: target/release/tokenharbor2api.exe

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/tokenharbor2api.exe
          generate_release_notes: true
